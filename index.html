<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hashim · Software Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0f1726; --ink:#eaf0fa; --dim:#8a9ab5; --hot:#5eead4; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; background:var(--bg); color:var(--ink); font-family:'Sora',system-ui,sans-serif; overflow:hidden; }
  canvas { position:fixed; inset:0; width:100%; height:100%; touch-action:none; cursor:grab; display:block; }
  canvas:active { cursor:grabbing; }
  .intro { position:fixed; left:clamp(20px,5vw,64px); bottom:clamp(24px,6vh,64px); max-width:30rem; pointer-events:none; }
  h1 { font-weight:600; font-size:clamp(1.8rem,5vw,3.2rem); letter-spacing:-0.02em; line-height:1.1; }
  p { font-weight:300; color:var(--dim); margin-top:.7rem; line-height:1.6; font-size:.98rem; }
  .hint { position:fixed; top:20px; right:24px; font-size:.8rem; color:var(--dim); font-weight:300; }
  .hint b { color:var(--hot); font-weight:600; }
  .links { position:fixed; right:clamp(20px,5vw,64px); bottom:clamp(24px,6vh,64px); }
  .links a { color:var(--ink); text-decoration:none; border-bottom:1px solid var(--hot); padding-bottom:2px; font-size:.95rem; }
  .links a:focus-visible { outline:2px solid var(--hot); outline-offset:4px; }
  @media (max-width:600px){ .links{ left:20px; right:auto; bottom:12px; } .intro{ bottom:56px; } }
</style>
</head>
<body>
<canvas id="c" aria-label="Interactive 3D globe of my tech stack. Drag to rotate."></canvas>
<div class="intro">
  <h1>Hashim</h1>
  <p>Software engineer, 10+ years on the web. Scalable frontends, good developer experience, code that stays readable.</p>
</div>
<div class="hint">Drag to spin. Hover to <b>pick</b> a technology.</div>
<div class="links"><a href="https://github.com/YOUR-USERNAME">GitHub profile</a></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var core = ['React','Next.js','TypeScript','JavaScript','Node.js','Svelte','TailwindCSS','Flutter','Python'];
  var extra = ['PHP','Single-SPA','Redux','Vuex','Micro-frontends','System design','Performance'];
  var items = core.map(function (t) { return { t:t, core:true }; })
                  .concat(extra.map(function (t) { return { t:t, core:false }; }));

  var canvas = document.getElementById('c');
  var renderer = new THREE.WebGLRenderer({ canvas:canvas, antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.z = 9;
  var globe = new THREE.Group();
  scene.add(globe);
  var R = 3.1;

  // wireframe shell
  var shell = new THREE.LineSegments(
    new THREE.WireframeGeometry(new THREE.IcosahedronGeometry(R * 0.98, 2)),
    new THREE.LineBasicMaterial({ color:0x2a3a57, transparent:true, opacity:0.55 })
  );
  globe.add(shell);

  // label textures
  function makeTex(text, color, big) {
    var c = document.createElement('canvas');
    c.width = 384; c.height = 96;
    var x = c.getContext('2d');
    x.font = (big ? '600 44px' : '300 36px') + ' Sora, system-ui, sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillStyle = color;
    x.fillText(text, 192, 48);
    var t = new THREE.CanvasTexture(c);
    t.minFilter = THREE.LinearFilter;
    return t;
  }

  var sprites = [];
  var n = items.length, golden = Math.PI * (3 - Math.sqrt(5));
  items.forEach(function (it, i) {
    var y = 1 - (i / (n - 1)) * 2, r = Math.sqrt(1 - y * y), th = golden * i;
    var pos = new THREE.Vector3(Math.cos(th) * r, y, Math.sin(th) * r).multiplyScalar(R);
    var normal = makeTex(it.t, it.core ? '#eaf0fa' : '#8a9ab5', it.core);
    var hot = makeTex(it.t, '#5eead4', true);
    var s = new THREE.Sprite(new THREE.SpriteMaterial({ map:normal, transparent:true, depthTest:false }));
    s.position.copy(pos);
    s.scale.set(1.9, 0.475, 1);
    s.userData = { normal:normal, hot:hot };
    globe.add(s);
    sprites.push(s);

    var dot = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 12),
      new THREE.MeshBasicMaterial({ color: it.core ? 0x5eead4 : 0x4a5d80 }));
    dot.position.copy(pos).multiplyScalar(0.985);
    globe.add(dot);
  });

  // interaction
  var vx = 0.0035, vy = 0, dragging = false, lx = 0, ly = 0, hovered = null;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var idle = reduce ? 0 : 0.0035;
  canvas.addEventListener('pointerdown', function (e) { dragging = true; lx = e.clientX; ly = e.clientY; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointerup', function () { dragging = false; });
  canvas.addEventListener('pointermove', function (e) {
    mouse.x = (e.clientX / innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / innerHeight) * 2 + 1;
    if (!dragging) return;
    vx = (e.clientX - lx) * 0.005; vy = (e.clientY - ly) * 0.005;
    lx = e.clientX; ly = e.clientY;
    globe.rotateOnWorldAxis(new THREE.Vector3(0, 1, 0), vx);
    globe.rotateOnWorldAxis(new THREE.Vector3(1, 0, 0), vy);
  });

  var mouse = new THREE.Vector2(9, 9), ray = new THREE.Raycaster(), tmp = new THREE.Vector3();

  function resize() {
    var w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.position.z = w < 700 ? 11.5 : 9;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();

  function frame() {
    if (!dragging) {
      globe.rotateOnWorldAxis(new THREE.Vector3(0, 1, 0), vx);
      globe.rotateOnWorldAxis(new THREE.Vector3(1, 0, 0), vy);
      vx += (idle - vx) * 0.03; vy *= 0.94;
    }
    // fade labels on the far side
    sprites.forEach(function (s) {
      s.getWorldPosition(tmp);
      s.material.opacity = THREE.MathUtils.clamp(0.2 + (tmp.z + R) / (R * 1.6), 0.2, 1);
    });
    // hover
    ray.setFromCamera(mouse, camera);
    var hit = ray.intersectObjects(sprites)[0];
    var next = hit ? hit.object : null;
    if (next !== hovered) {
      if (hovered) { hovered.material.map = hovered.userData.normal; hovered.scale.set(1.9, 0.475, 1); }
      if (next) { next.material.map = next.userData.hot; next.scale.set(2.4, 0.6, 1); }
      hovered = next;
      canvas.style.cursor = next ? 'pointer' : '';
    }
    if (hovered) vx *= 0.9;
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function(){ frame(); });
})();
</script>
</body>
</html>
