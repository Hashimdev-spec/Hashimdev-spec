<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Hashim, software engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="300" rx="18" fill="#0f1726"/>

  <!-- slowly turning wireframe globe -->
  <g fill="none" stroke="#2a3a57" stroke-width="1.2">
    <circle cx="780" cy="150" r="96"/>
    <ellipse cx="780" cy="150" rx="96" ry="18"/>
    <ellipse cx="780" cy="102" rx="83" ry="15"/>
    <ellipse cx="780" cy="198" rx="83" ry="15"/>
    <ellipse cx="780" cy="72" rx="56" ry="10"/>
    <ellipse cx="780" cy="228" rx="56" ry="10"/>
    <ellipse cx="780" cy="150" rx="96" ry="96"><animate attributeName="rx" values="96;0;96" dur="14s" begin="0s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="780" cy="150" rx="96" ry="96"><animate attributeName="rx" values="96;0;96" dur="14s" begin="-2.33s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="780" cy="150" rx="96" ry="96"><animate attributeName="rx" values="96;0;96" dur="14s" begin="-4.67s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="780" cy="150" rx="96" ry="96"><animate attributeName="rx" values="96;0;96" dur="14s" begin="-7s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="780" cy="150" rx="96" ry="96"><animate attributeName="rx" values="96;0;96" dur="14s" begin="-9.33s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="780" cy="150" rx="96" ry="96"><animate attributeName="rx" values="96;0;96" dur="14s" begin="-11.67s" repeatCount="indefinite"/></ellipse>
  </g>
  <g fill="#5eead4">
    <circle cx="742" cy="122" r="2.5"><animate attributeName="opacity" values="1;.25;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="822" cy="172" r="2.5"><animate attributeName="opacity" values="1;.25;1" dur="5s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="796" cy="94" r="2.5"><animate attributeName="opacity" values="1;.25;1" dur="6s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="758" cy="202" r="2.5"><animate attributeName="opacity" values="1;.25;1" dur="4.5s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="836" cy="126" r="2.5"><animate attributeName="opacity" values="1;.25;1" dur="5.5s" begin="-.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- type -->
  <line x1="64" y1="92" x2="132" y2="92" stroke="#5eead4" stroke-width="2" stroke-dasharray="68" stroke-dashoffset="68">
    <animate attributeName="stroke-dashoffset" from="68" to="0" dur="1.2s" fill="freeze"/>
  </line>
  <text x="62" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="68" fill="#eaf0fa" letter-spacing="-1">Hashim</text>
  <text x="64" y="210" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8a9ab5">Software engineer. Ten years on the web.</text>
  <text x="64" y="240" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#6f819f">Frontend architecture, developer experience, readable code.</text>
</svg>
